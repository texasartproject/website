# local development server, configured to behave like GitHub Pages
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # redirect /dir to /dir/ using a relative Location, so the container's port 80
    # doesn't leak into redirects when it's published on another host port (8080)
    absolute_redirect off;

    # always revalidate so edits show up on reload (GitHub Pages caches for 10 minutes)
    add_header Cache-Control "no-cache";

    location / {
        try_files $uri $uri/ =404;
    }

    # like GitHub Pages, serve the site's 404 page for any missing path
    error_page 404 /404.html;
}
